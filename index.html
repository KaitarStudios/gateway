<!DOCTYPE html>
<html lang="en">
<head>
    <title>Quick Status Test</title>
</head>
<body>
    <h2>Website Status: <span id="result">Checking...</span></h2>

    <script>
        const statusText = document.getElementById('result');
        const img = new Image();
        
        // Point this to a known image or favicon on the target site
        img.src = "http://g8t2w2y.sytes.net/icon.jpg";

        img.onload = function() {
            statusText.textContent = "🟢 Up";
            statusText.style.color = "green";
        };

        img.onerror = function() {
            statusText.textContent = "🔴 Down";
            statusText.style.color = "red";
        };
    </script>
</body>
